[project]
name = "filler-free-cli"
version = "1.0.0"
description = "Headless companion for Filler-Free: Live -- drives the same backend the Android app uses."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.scripts]
filler-free-cli = "cli.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli"]
